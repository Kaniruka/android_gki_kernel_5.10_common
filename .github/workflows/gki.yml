name: Generic GKI profiles

on:
  workflow_dispatch:
    inputs:
      root_variant:
        description: Root profile to build
        type: choice
        default: all
        options: [all, none, bakasu-susfs]
  push:
    branches: [android12-5.10-2025-09]
  pull_request:
    branches: [android12-5.10-2025-09]

permissions:
  contents: read

concurrency:
  group: gki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        root_variant: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["none","bakasu-susfs"]' || inputs.root_variant == 'all' && '["none","bakasu-susfs"]' || format('["{0}"]', inputs.root_variant)) }}
    env:
      ROOT_VARIANT: ${{ matrix.root_variant }}
      OUT_DIR: ${{ github.workspace }}/out/${{ matrix.root_variant }}
      DIST_DIR: ${{ github.workspace }}/dist/${{ matrix.root_variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize BakaSU with its version history
        run: git submodule update --init --recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses5 libtinfo5 python3 python-is-python3 lz4 dwarves rsync cpio xz-utils shellcheck
      - name: Check shell scripts
        run: shellcheck -x ci/*.sh security/baseband_guard/tests/run.sh
      - name: Check Baseband Guard policy
        run: sh security/baseband_guard/tests/run.sh
      - name: Cache pinned AOSP compiler
        id: compiler-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/clang-r416183b
          key: aosp-clang-linux-x86-${{ hashFiles('ci/toolchain.env') }}
      - name: Fetch compiler
        run: ci/fetch-toolchain.sh
      - name: Save verified compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/clang-r416183b
          key: aosp-clang-linux-x86-${{ hashFiles('ci/toolchain.env') }}
      - name: Build generic arm64 GKI
        shell: bash
        run: |
          set -o pipefail
          ci/build-gki.sh 2>&1 | tee "build-${ROOT_VARIANT}.log"
      - name: Build scoped visibility selftest
        run: make -C tools/testing/selftests/scoped_visibility
      - name: Compile default-off visibility prototype in isolated output
        run: bash ci/check-scoped-visibility.sh
      - name: Upload kernel, symbols and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gki-android12-5.10-${{ matrix.root_variant }}-${{ github.sha }}
          path: dist/${{ matrix.root_variant }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log-${{ matrix.root_variant }}-${{ github.sha }}
          path: build-${{ matrix.root_variant }}.log
          if-no-files-found: ignore
          retention-days: 14
